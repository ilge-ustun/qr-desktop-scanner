name: macOS build

# Every change to code gets a real macOS build: the only place the macOS-only
# code compiles and the app is bundled. (Free: the repository is public.)
# One exception: a push that changes only the fleet's state (.stories/,
# .review/, .blocked/) does not build. No code changed, so the build was
# wasted, and these builds filled the macOS queue at a time when GitHub
# dropped jobs for lack of runners. Pull requests and manual runs always build.
# Actions are pinned to commit SHAs (a moved tag can't change what runs);
# Dependabot proposes updates.
on:
  push:
    branches: [main, develop]
    paths-ignore:
      - .stories/**
      - .review/**
      - .blocked/**
  pull_request:
  workflow_dispatch:

# Read-only token: nothing here pushes, comments or publishes.
permissions:
  contents: read

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

      - run: npm run tauri build -- --bundles app,dmg
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: QR-Scanner-macos-arm64
          path: target/release/bundle/dmg/*.dmg
