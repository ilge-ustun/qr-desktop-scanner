name: macOS build

# Every change gets a real macOS build: the only place the macOS-only code
# compiles and the app is bundled. (Free: the repository is public.)
on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2

      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

      - run: npm run tauri build -- --bundles app,dmg
      - uses: actions/upload-artifact@v4
        with:
          name: QR-Scanner-macos-arm64
          path: target/release/bundle/dmg/*.dmg
