name: Release

# Push a tag like v0.1.0 and this builds the DMG and publishes it as a
# GitHub Release. The tag must match "version" in src-tauri/tauri.conf.json.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Tag matches the app version
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match tauri.conf.json version $version"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          # One DMG for Apple Silicon and Intel Macs.
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2

      - run: npm ci
      - run: npm test
      - run: cargo test --workspace

      - run: npm run tauri build -- --target universal-apple-darwin --bundles app,dmg

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" target/universal-apple-darwin/release/bundle/dmg/*.dmg \
            --title "QR Scanner $GITHUB_REF_NAME" \
            --notes-file .github/release-notes.md
