name: Release

# Push a tag like v0.1.0 and this builds the DMG and publishes it as a
# GitHub Release. The tag must match "version" in src-tauri/tauri.conf.json.
# This job can publish under the owner's name and ships an app that asks for
# Screen Recording, so every action is pinned to a commit SHA, and the DMG
# goes out with a SHA-256 and a build provenance attestation.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Tag matches the app version
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match tauri.conf.json version $version"
            exit 1
          fi

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          # One DMG for Apple Silicon and Intel Macs.
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - run: npm ci
      - run: npm test
      - run: cargo test --workspace

      - run: npm run tauri build -- --target universal-apple-darwin --bundles app,dmg

      # No spaces in the asset name: GitHub would rename it, and the checksum
      # file must name the file people download.
      - name: Name the DMG and its checksum
        run: |
          mkdir dist-release
          cp target/universal-apple-darwin/release/bundle/dmg/*.dmg "dist-release/QR-Scanner-$GITHUB_REF_NAME-universal.dmg"
          cd dist-release && shasum -a 256 *.dmg > SHA256SUMS.txt && cat SHA256SUMS.txt

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist-release/*.dmg

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist-release/*.dmg dist-release/SHA256SUMS.txt \
            --title "QR Scanner $GITHUB_REF_NAME" \
            --notes-file .github/release-notes.md
