[package]
name = "qr-desktop-scanner"
version = "0.1.0"
description = "Menu-bar QR scanner for macOS: the Tauri shell around qr-core"
edition.workspace = true
license.workspace = true

[lib]
name = "qr_desktop_scanner_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
qr-core = { path = "../core" }
serde = { version = "1", features = ["derive"] }
tauri = { version = "2.12", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-clipboard-manager = "2.5"
tauri-plugin-global-shortcut = "2.4"
tauri-plugin-opener = "2.7"
tauri-plugin-positioner = { version = "2.4", features = ["tray-icon"] }
